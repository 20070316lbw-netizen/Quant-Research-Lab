[project]
name = "quant-research-lab"
version = "0.1.0"
description = "金融与宏观实证研究的论文复现、数据处理与统计检验"
readme = "README.md"
authors = [
    { name = "20070316lbw-netizen", email = "244884540+20070316lbw-netizen@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "huggingface-hub>=2.4.0",
    "loguru>=0.8.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
quant-research-lab = "quant_research_lab:main"

[project.optional-dependencies]
cn-macro = [
    "netcdf4>=1.7.5.1.post1",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
